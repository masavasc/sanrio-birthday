main{max-width:640px;margin:40px auto;padding:32px;background:white;border:1px solid #fff;border-radius:28px;box-shadow:0 12px 48px #216ba514}
header{text-align:center;margin-bottom:28px}.eyebrow{color:var(--blue);font-size:.8rem;font-weight:700;letter-spacing:.13em;margin:0 0 10px}h1{font-size:clamp(1.3rem,4vw,1.7rem);line-height:1.5;margin:0;color:var(--blue)}header p:last-child{color:var(--muted);margin:12px 0 0}
form{background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:22px}fieldset{padding:0;border:0;margin:0}legend{font-weight:700;margin-bottom:12px}.date-row{display:flex;gap:12px;align-items:end}.field{flex:1;min-width:0}label{display:block;font-size:.875rem;font-weight:700;margin-bottom:5px}
select,button{font:inherit}select{width:100%;font-size:1.3rem;font-weight:700;min-height:54px;padding:8px 12px;background:white;color:var(--ink);border:1px solid #9dbed8;border-radius:12px;cursor:pointer}button{cursor:pointer;border:1px solid transparent;border-radius:12px;min-height:44px;padding:9px 16px;color:var(--blue);background:white;font-weight:700}button:hover{background:#dcefff}button:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid #145ba4;outline-offset:3px}.search{background:var(--blue);color:white;width:100%;margin-top:16px;min-height:50px}.search:hover{background:#175783}.today{border-color:var(--line);min-height:54px;white-space:nowrap}.hint{font-size:.875rem;color:var(--muted);margin:10px 0 0;min-height:1.5em}
details{margin-top:14px}summary{cursor:pointer;color:var(--blue);font-size:.875rem;font-weight:700;padding:5px 0}.day-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:12px}.day-grid button{padding:6px 0;min-width:0;border-color:var(--line)}.day-grid [aria-pressed="true"]{background:var(--blue);color:white}
.result-area{margin-top:28px;border-top:1px solid var(--line);padding-top:24px}.result-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}h2{font-size:1.1rem;margin:0}.count{font-size:.875rem;color:var(--blue);background:var(--soft);padding:3px 12px;border-radius:20px;white-space:nowrap}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:white;min-width:0}.portrait{height:180px;display:flex;align-items:center;justify-content:center;background:#f5faff;padding:16px}.portrait img{display:block;max-width:100%;width:100%;height:100%;object-fit:contain}.fallback{font-size:.875rem;color:var(--muted);text-align:center}.card-copy{padding:16px}.card h3{font-size:1.05rem;margin:0 0 4px;overflow-wrap:anywhere;line-height:1.55}.series{font-size:.8rem;color:var(--muted);margin:0 0 10px;overflow-wrap:anywhere}.source{font-size:.8rem;color:var(--blue);text-underline-offset:3px}.empty{text-align:center;padding:30px 12px;background:var(--soft);border-radius:18px;color:var(--muted)}.empty p{margin:0}.empty p+p{font-size:.875rem;margin-top:8px}footer{margin-top:24px;color:var(--muted);font-size:.75rem;text-align:center}footer a{color:inherit}[hidden]{display:none!important}
@media(max-width:480px){main{margin:16px 12px;padding:22px 16px;border-radius:22px}form{padding:16px}.date-row{gap:8px}.today{padding:8px 10px}.portrait{height:145px;padding:12px}.card-copy{padding:12px}.cards{gap:10px}}
@media(max-width:340px){.cards{grid-template-columns:1fr}.date-row{flex-wrap:wrap}.today{width:100%}}
.header-kitty{display:block;width:104px;height:104px;object-fit:contain;margin:0 auto 14px}header{padding-top:4px}.source{font-size:.875rem}
</style>

<main>
<header><img class="header-kitty" src="https://www.sanrio.co.jp/wp-content/uploads/2022/06/list-hellokitty.png" alt="ハローキティ" width="104" height="104" referrerpolicy="no-referrer" decoding="async"><p class="eyebrow">BIRTHDAY CHARACTER FINDER</p><h1>サンリオ誕生日<br>キャラクター検索</h1><p>同じ誕生日のキャラクターを見つけよう。</p></header>
<form id="birthday-form">
<fieldset><legend>あなたの誕生日</legend><div class="date-row">
<div class="field"><label for="month">月</label><select id="month" required aria-describedby="date-hint"></select></div>
<div class="field"><label for="day">日</label><select id="day" required aria-describedby="date-hint"></select></div>
<button type="button" class="today" id="today">今日</button></div></fieldset>
<p id="date-hint" class="hint" role="status">年の入力は不要です。2月29日も選べます。</p>
<details><summary>日を一覧から選ぶ</summary><div class="day-grid" id="day-grid" aria-label="日を選択"></div></details>
<button type="submit" class="search">この誕生日で検索</button>
</form>
<section class="result-area" aria-label="検索結果"><div class="result-heading"><h2 id="result-title">誕生日を選んで検索</h2><span class="count" id="count" hidden></span></div><p id="announcement" role="status" class="hint" hidden></p><div id="result"><div class="empty"><p>あなたと同じ日に生まれたのは、だれ？</p><p>月と日を選んで、検索ボタンを押してください。</p></div></div></section>
<footer>非公式の検索アプリです。誕生日は登録データに基づきます。<br>画像・キャラクターの権利は各権利者に帰属します。<br>画像出典：<a href="https://www.sanrio.co.jp/characters/" target="_blank" rel="noopener noreferrer">サンリオ公式サイト</a>（画像の表示にはインターネット接続が必要です）</footer>
<noscript>このアプリを使うには、ブラウザーのJavaScriptを有効にしてください。</noscript>
</main>

    "series": "チャーミーキティ",
    "month": 12,
    "day": 31,
    "image": "https://www.sanrio.co.jp/wp-content/uploads/2022/06/list-charmmy.png",
    "source": "https://www.sanrio.co.jp/characters/charmmy/",
    "imageKind": "portrait"
  },
  {
    "name": "まめた",
    "series": "ちびまる",
    "month": 12,
    "day": 31,
    "image": "https://www.sanrio.co.jp/wp-content/uploads/2022/06/sub-chibimaru-mameta.png",
    "source": "https://www.sanrio.co.jp/characters/chibimaru/"
  }
];
const monthSelect=document.getElementById('month');
const daySelect=document.getElementById('day');
const grid=document.getElementById('day-grid');
const hint=document.getElementById('date-hint');
const result=document.getElementById('result');
const title=document.getElementById('result-title');
const count=document.getElementById('count');
const announcement=document.getElementById('announcement');
const daysInMonth=m=>[31,29,31,30,31,30,31,31,30,31,30,31][m-1]||0;
const validDate=(m,d)=>Number.isInteger(m)&&Number.isInteger(d)&&d>=1&&d<=daysInMonth(m);
function make(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el;}
function syncGrid(){for(const button of grid.children)button.setAttribute('aria-pressed',String(button.dataset.day===daySelect.value));}
function updateDays(){
 const previous=Number(daySelect.value)||1;const last=daysInMonth(Number(monthSelect.value));
 daySelect.replaceChildren();grid.replaceChildren();
 for(let d=1;d<=last;d++){
 daySelect.add(new Option(d+'日',d));const b=make('button',String(d));b.type='button';b.dataset.day=String(d);b.setAttribute('aria-label',monthSelect.value+'月'+d+'日');b.addEventListener('click',()=>{daySelect.value=String(d);syncGrid();markPending();});grid.append(b);
 }
 daySelect.value=String(Math.min(previous,last));syncGrid();
 hint.textContent=previous>last?monthSelect.value+'月は'+last+'日までのため、'+last+'日に変更しました。':'年の入力は不要です。2月29日も選べます。';
}
function markPending(){title.textContent='誕生日を選んで検索';count.hidden=true;announcement.hidden=true;result.replaceChildren();const box=make('div',undefined,'empty');box.append(make('p',monthSelect.value+'月'+daySelect.value+'日を選択中'),make('p','検索ボタンを押すと結果が表示されます。'));result.append(box);}
function searchBirthday(){
 const m=Number(monthSelect.value),d=Number(daySelect.value);
 if(!validDate(m,d)){hint.textContent='正しい月と日を選んでください。';return;}
 const rows=charData.filter(r=>r.month===m&&r.day===d);
 title.textContent=m+'月'+d+'日生まれ';count.textContent=rows.length+'件';count.hidden=false;
 announcement.hidden=false;announcement.textContent=rows.length? '同じ誕生日のキャラクターが見つかりました。':'この日のキャラクターは登録されていません。';
 result.replaceChildren();
 if(!rows.length){const empty=make('div',undefined,'empty');empty.append(make('p','登録データに該当するキャラクターがいません。'),make('p','別の日付でも探してみてください。'));result.append(empty);return;}
 const cards=make('div',undefined,'cards');
 for(const row of rows){
 const card=make('article',undefined,'card'),portrait=make('div',undefined,'portrait');
 const fallback=make('span',row.image?'画像を読み込めませんでした':'このキャラクターの画像は未登録です','fallback');
 if(row.image){const img=make('img');img.alt=row.imageKind==='series'?row.series+'のシリーズ参考画像':row.name;img.loading='lazy';img.decoding='async';img.referrerPolicy='no-referrer';img.addEventListener('error',()=>{img.remove();portrait.append(fallback);},{once:true});img.src=row.image;portrait.append(img);}else portrait.append(fallback);
 const copy=make('div',undefined,'card-copy'),link=make('a','公式プロフィールを見る','source');link.href=row.source;link.target='_blank';link.rel='noopener noreferrer';copy.append(make('h3',row.name),make('p',row.series,'series'),link);if(row.imageKind==='series')copy.append(make('p','シリーズ参考画像（個別画像は未登録）','series'));card.append(portrait,copy);cards.append(card);
 }
 result.append(cards);
}
for(let m=1;m<=12;m++)monthSelect.add(new Option(m+'月',m));
const now=new Date();monthSelect.value=String(now.getMonth()+1);updateDays();daySelect.value=String(now.getDate());syncGrid();
monthSelect.addEventListener('change',()=>{updateDays();markPending();});
daySelect.addEventListener('change',()=>{syncGrid();hint.textContent='年の入力は不要です。2月29日も選べます。';markPending();});
document.getElementById('birthday-form').addEventListener('submit',event=>{event.preventDefault();searchBirthday();});
document.getElementById('today').addEventListener('click',()=>{const today=new Date();monthSelect.value=String(today.getMonth()+1);updateDays();daySelect.value=String(today.getDate());syncGrid();hint.textContent='今日の日付を選びました。';searchBirthday();});
</script>
</body>
</html>
